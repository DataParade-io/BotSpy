[package]
name = "botspy"
version = "0.3.0"
edition = "2021"
description = "Pop open the conversation history of any coding agent: one adapter per agent, one normalized schema, one unified agent-session history."
license = "MIT"
repository = "https://github.com/DataParade-io/BotSpy"
readme = "README.md"
keywords = ["coding-agents", "chat-history", "sessions", "ai", "cli"]
categories = ["development-tools", "text-processing"]
# Allowlist for the packaged crate: crates.io caps the .crate at 10 MiB,
# and the git tree carries ~15 MiB of docs diagrams that the crate never
# reads. features/ stays because src/spec/ embeds the .feature files with
# include_str! at compile time.
include = [
    "/src",
    "/features",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[dependencies]
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
sqlite-vec = "=0.1.9"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tract-onnx = "0.23.8"
tokenizers = "0.23.2"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
libc = "0.2"
tempfile = "3"
same-file = "1"

[dev-dependencies]
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "bdd"
harness = false

[[bin]]
name = "botspy"
path = "src/main.rs"

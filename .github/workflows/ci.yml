name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # The embedding-model cache the setup step fills once (BOTSPY-c3cf41);
  # every job reads it from here, never the network at runtime.
  BOTSPY_MODELS: ${{ github.workspace }}/.botspy-models

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .botspy-models
          key: botspy-models-${{ hashFiles('src/store/assets.rs') }}
      - run: cargo run --example setup_models
      - run: cargo test --target ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }} --test bdd
      - run: cargo test --doc

  musl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo install cross --locked
      - uses: actions/cache@v4
        with:
          path: .botspy-models
          key: botspy-models-${{ hashFiles('src/store/assets.rs') }}
      - run: cargo run --example setup_models
        env:
          BOTSPY_MODELS: ${{ github.workspace }}/.botspy-models
      # cross mounts the workspace at /project inside its container, so
      # the model cache the host just filled sits at /project there.
      # sqlite-vec 0.1.9's C source typedefs its bytes off the BSD-style
      # u_intN_t names, which musl libc does not define; cc-rs appends
      # CFLAGS_<target> to every compile it runs, so alias them to the
      # standard <stdint.h> names. Cross.toml passthrough carries these
      # and BOTSPY_MODELS into the container (cross does not forward
      # host env by default).
      - run: cross test --target ${{ matrix.target }}
        env:
          BOTSPY_MODELS: /project/.botspy-models
          CFLAGS_x86_64_unknown_linux_musl: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t
          CFLAGS_aarch64_unknown_linux_musl: -Du_int8_t=uint8_t -Du_int16_t=uint16_t -Du_int32_t=uint32_t -Du_int64_t=uint64_t

  # crates.io rejects .crate uploads over 10 MiB (HTTP 413); keep a MiB
  # of headroom so a stray asset cannot block a release again.
  package-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked
      - name: Fail if the packaged crate exceeds the crates.io budget
        run: |
          max_bytes=$((9 * 1024 * 1024))
          crate_path=$(ls target/package/botspy-*.crate)
          crate_bytes=$(stat -c%s "$crate_path")
          echo "packaged crate: ${crate_bytes} bytes (${crate_path})"
          if [ "${crate_bytes}" -gt "${max_bytes}" ]; then
            echo "::error title=Crate too large::${crate_path} is ${crate_bytes} bytes, over the ${max_bytes}-byte budget (crates.io limit is 10 MiB). Check the include allowlist in Cargo.toml."
            exit 1
          fi
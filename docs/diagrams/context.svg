ex,</tspan><tspan x="299.5" dy="16.714286">Grok Bot, Antigravity</tspan><tspan x="299.5" dy="16.714286"> </tspan><tspan x="299.5" dy="16.714286">Each agent writes its session</tspan><tspan x="299.5" dy="16.714286">data to its own local files</tspan></text></g><g class="c3RvcmU= sensitive"><g class="shape" ><path d="M 385 90 C 385 66 512 66 526 66 C 540 66 667 66 667 90 V 240 C 667 264 540 264 526 264 C 512 264 385 264 385 240 V 90 Z" stroke="#d97706" class=" fill-AA4" style="stroke-width:3;" /><path d="M 385 90 C 385 114 512 114 526 114 C 540 114 667 114 667 90" stroke="#d97706" class=" fill-AA4" style="stroke-width:3;" /></g><text x="526" y="142.5" class="text-bold fill-N1" style="text-anchor:middle;font-size:16px"><tspan x="526" dy="0">Sensitive data: BotSpy local store</tspan><tspan x="526" dy="16.833333"> </tspan><tspan x="526" dy="16.833333">~/.botspy/store.db</tspan><tspan x="526" dy="16.833333">Copies of session history:</tspan><tspan x="526" dy="16.833333">sessions, messages, parts,</tspan><tspan x="526" dy="16.833333">full-text and vector indexes</tspan></text></g><g class="KHVzZXIgLSZndDsgYm90c3B5KVswXQ=="><marker id="mk-d2-1930649778-3488378134" markerWidth="10" markerHeight="12" refX="7" refY="6" viewBox="0 0 10 12" orient="auto" markerUnits="userSpaceOnUse"> <polygon points="0,0 10,6 0,12" class="connection fill-B1" stroke-width="2" /> </marker><path d="M 245 266 L 245 410" fill="none" class="connection stroke-B1" style="stroke-width:2;" marker-end="url(#mk-d2-1930649778-3488378134)" mask="url(#d2-1930649778)" /><text x="119.5" y="329" class="text-italic fill-N2" style="text-anchor:middle;font-size:16px"><tspan x="119.5" dy="0">Runs commands:</tspan><tspan x="119.5" dy="17.666667">sources, sessions, show, search,</tspan><tspan x="119.5" dy="17.666667">import, doctor, snapshot, stats, scan</tspan></text></g><g class="KGJvdHNweSAtJmd0OyBhZ2VudF9kYXRhKVswXQ=="><path d="M 300 536 L 300 679.5" fill="none" class="connection stroke-B1" style="stroke-width:2;" 